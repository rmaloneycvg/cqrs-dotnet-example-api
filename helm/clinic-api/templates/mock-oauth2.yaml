{{- if .Values.mockOAuth2.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oauth2
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
    app: mock-oauth2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oauth2
  template:
    metadata:
      labels:
        app: mock-oauth2
    spec:
      containers:
        - name: mock-oauth2
          image: "{{ .Values.mockOAuth2.image.repository }}:{{ .Values.mockOAuth2.image.tag }}"
          imagePullPolicy: {{ .Values.mockOAuth2.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG
              value: |
                {
                  "interactiveLogin": true,
                  "tokenCallbacks": [
                    {
                      "issuerId": "default",
                      "requestMappings": [
                        {
                          "requestParam": "grant_type",
                          "match": "*",
                          "claims": {
                            "sub": "dev-user",
                            "name": "Dev User (admin)",
                            "role": "admin",
                            "org_id": "{{ .Values.mockOAuth2.defaultOrgId }}"
                          }
                        }
                      ]
                    }
                  ]
                }
          resources:
            {{- toYaml .Values.mockOAuth2.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-oauth2
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
spec:
  selector:
    app: mock-oauth2
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
{{- end }}
