{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
data:
  rabbitmq.conf: |
    # Suppress deprecation warning for management metrics collection
    deprecated_features.permit.management_metrics_collection = true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rabbitmq.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rabbitmq.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.rabbitmq.auth.username | default "guest" | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clinicApi.secretRef }}
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            {{- if .Values.rabbitmq.persistence.enabled }}
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
            {{- end }}
      volumes:
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
        {{- if .Values.rabbitmq.persistence.enabled }}
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5672
      targetPort: 5672
      name: amqp
    - port: 15672
      targetPort: 15672
      name: management
  type: ClusterIP
{{- if .Values.rabbitmq.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.rabbitmq.persistence.size }}
  {{- if .Values.rabbitmq.persistence.storageClass }}
  storageClassName: {{ .Values.rabbitmq.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
