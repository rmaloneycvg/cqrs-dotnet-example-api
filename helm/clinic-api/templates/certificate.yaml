{{- if and .Values.nginxGateway.enabled (eq .Values.nginxGateway.tls.mode "cert-manager") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-tls
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.nginxGateway.tls.secretName }}
  issuerRef:
    name: {{ .Values.nginxGateway.tls.issuerName }}
    kind: {{ .Values.nginxGateway.tls.issuerKind }}
  dnsNames:
    {{- range .Values.nginxGateway.tls.dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
