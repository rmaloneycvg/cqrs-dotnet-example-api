{{- if .Values.nginxGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
    {{- include "nginxGateway.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nginxGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "nginxGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nginxGateway.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user in nginx:alpine image
      containers:
        - name: nginx-gateway
          image: "{{ .Values.nginxGateway.image.repository }}:{{ .Values.nginxGateway.image.tag }}"
          imagePullPolicy: {{ .Values.nginxGateway.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- if ne .Values.nginxGateway.tls.mode "self-signed" }}
            - name: tls-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
            {{- end }}
            - name: cache-volume
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.nginxGateway.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        {{- if ne .Values.nginxGateway.tls.mode "self-signed" }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.nginxGateway.tls.secretName }}
            optional: true
        {{- end }}
        - name: cache-volume
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: {{ include "clinic-api.namespace" . }}
  labels:
    {{- include "clinic-api.labels" . | nindent 4 }}
  {{- if and .Values.security.ring1.enabled .Values.security.ring1.waf.enabled }}
  annotations:
    {{- toYaml .Values.security.ring1.waf.annotations | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "nginxGateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.nginxGateway.service.httpsPort }}
      targetPort: 8443
    - name: http
      port: {{ .Values.nginxGateway.service.httpPort }}
      targetPort: 8080
  type: {{ .Values.nginxGateway.service.type }}
{{- end }}
