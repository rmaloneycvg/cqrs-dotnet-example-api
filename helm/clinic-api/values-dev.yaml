# ─── Dev Environment Overrides ────────────────────────────────────────────────
# Local development via Tilt. Single replicas, relaxed limits, self-signed TLS.
# Secrets are loaded from .env.dev (gitignored) and injected via Tilt.

global:
  namespace: clinic-api

clinicApi:
  replicaCount: 1
  image:
    repository: clinic-api-image
    tag: "latest"
    pullPolicy: Never  # Tilt builds locally
  securityContext:
    readOnlyRootFilesystem: false  # SDK needs writable fs for hot-reload
  env:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: "http://+:5000"
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  # SDK cold start (restore + build) takes 40-60s
  readinessProbe:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    path: /health
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 5

nginxGateway:
  replicaCount: 1
  image:
    repository: nginx-gateway-image
    tag: "latest"
    pullPolicy: Never
  tls:
    mode: self-signed
    # NOTE: Staging/prod use cert-manager with a Certificate resource that creates
    # a k8s Secret mounted as a volume. Dev uses certs baked into the Docker image.
    # The TLS volume mount path in nginx.yaml is only exercised when mode != "self-signed".
  cors:
    origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "https://localhost"
  rateLimiting:
    api:
      rate: "100r/s"
      burst: 50     # More lenient for dev testing
    auth:
      rate: "30r/s"  # Less strict for dev
      burst: 10
  rabbitmqManagement:
    enabled: true

mssql:
  enabled: true
  persistence:
    enabled: true     # Persist data across restarts (mirrors staging/prod behavior)
    size: "1Gi"
    storageClass: ""  # Uses cluster default (Docker Desktop / Rancher provides one)
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

rabbitmq:
  enabled: true
  persistence:
    enabled: false  # Ephemeral in dev (topology pre-loaded via definitions.json ConfigMap)

dbMigrate:
  enabled: true
  image:
    repository: clinic-api-image
    tag: "latest"
    pullPolicy: Never
  command:
    - dotnet
    - run
    - --project
    - src/ClinicApi/ClinicApi.csproj
    - --no-launch-profile
    - --
    - --migrate
  helmHook: false  # Tilt manages this as a manual trigger

# ─── Secrets (populated from .env.dev via Tilt) ──────────────────────────────
# Values are injected at runtime by the Tiltfile reading .env.dev.
# Do NOT commit actual secret values here. See .env.example for the template.
secrets:
  create: true
  data: {}

# ─── Security Rings (Dev: network policies + RBAC, no Istio) ─────────────────
security:
  ring1:
    enabled: false
  ring2:
    enabled: true
    networkPolicies:
      enabled: true    # Mirrors staging/prod — catches missing egress rules early
      defaultDeny: true
  ring3:
    enabled: false    # No Istio sidecar in dev
  ring4:
    enabled: true
    podSecurityAdmission:
      enabled: true
      level: baseline   # Allow debugging tools, privileged not needed
      mode: warn        # Warn only, don't block dev workflows
    rbac:
      enabled: true
      createServiceAccount: true
      serviceAccountName: clinic-api
    secretEncryption:
      enabled: false   # No KMS locally
  ring5:
    enabled: false     # No TDE or audit in dev
